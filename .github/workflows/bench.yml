name: bench

on:
  workflow_dispatch:
    inputs:
      reuben_ref:
        description: Reuben branch, tag, or commit to measure
        default: main
      baseline_ref:
        description: Reuben ref to time alongside it (empty for none)
        default: ""
      sizes:
        description: Page counts, space-separated
        default: "1000 10000"
      hash_case:
        description: Also time Reuben with asset hashing on
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

env:
  SIZES: ${{ github.event_name == 'workflow_dispatch' && inputs.sizes || '50' }}
  REUBEN_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.reuben_ref || 'main' }}
  BASELINE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_ref || '' }}
  HASH_CASE: ${{ github.event_name == 'workflow_dispatch' && inputs.hash_case && '1' || '0' }}

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reuben-ssg/reuben
          ref: ${{ env.REUBEN_REF }}
          path: reuben-src

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BASELINE_REF != ''
        with:
          repository: reuben-ssg/reuben
          ref: ${{ env.BASELINE_REF }}
          path: baseline-src

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            reuben-src
            baseline-src

      - name: Build Reuben
        run: cargo build --release --locked -p reuben
        working-directory: reuben-src

      - name: Build the baseline
        if: env.BASELINE_REF != ''
        run: cargo build --release --locked -p reuben
        working-directory: baseline-src

      - name: Install hyperfine, Hugo, and Zola
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -O https://github.com/sharkdp/hyperfine/releases/download/v2.0.0/hyperfine_2.0.0_amd64.deb
          sudo dpkg -i hyperfine_2.0.0_amd64.deb
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.170.1/hugo_0.170.1_linux-amd64.tar.gz | tar -xz -C "$HOME/.local/bin" hugo
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Generate the cases
        run: scripts/setup.sh $SIZES

      - name: Run the benchmarks
        run: |
          export QUIET=0
          export REUBEN="$GITHUB_WORKSPACE/reuben-src/target/release/reuben"
          if [ -n "$BASELINE_REF" ]; then
            export BASELINE="$GITHUB_WORKSPACE/baseline-src/target/release/reuben"
          fi
          scripts/run.sh $SIZES

      - name: Summarize
        if: always()
        run: |
          if [ -f results/latest/table.md ]; then
            cat results/latest/table.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f results/latest/versions.txt ]; then
            { echo; echo '```'; cat results/latest/versions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: results/latest
