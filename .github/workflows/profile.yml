name: profile

on:
  workflow_dispatch:
    inputs:
      reuben_ref:
        description: Reuben branch, tag, or commit to profile
        default: main
      size:
        description: Page count to profile
        default: "10000"
      zola_version:
        description: Zola version to build from source and profile
        default: 0.23.6

permissions:
  contents: read

concurrency:
  group: profile
  cancel-in-progress: false

env:
  REUBEN_REF: ${{ inputs.reuben_ref }}
  SIZE: ${{ inputs.size }}
  ZOLA_VERSION: ${{ inputs.zola_version }}
  # Symbols and frame pointers so perf can walk stacks without DWARF.
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_STRIP: none
  RUSTFLAGS: -C force-frame-pointers=yes

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reuben-ssg/reuben
          ref: ${{ env.REUBEN_REF }}
          path: reuben-src

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: reuben-src
          cache-bin: true

      - name: Build Reuben with symbols
        run: cargo build --release --locked -p reuben
        working-directory: reuben-src

      - name: Build Zola with symbols
        run: |
          set -euo pipefail
          if ! zola --version 2>/dev/null | grep -qF "$ZOLA_VERSION"; then
            # Zola isn't published to crates.io; build the release tag from its repository.
            cargo install --git https://github.com/getzola/zola --tag "v$ZOLA_VERSION" --locked zola
          fi
          zola --version

      - name: Install inferno
        run: |
          set -euo pipefail
          if ! command -v inferno-flamegraph >/dev/null; then
            RUSTFLAGS='' CARGO_PROFILE_RELEASE_DEBUG=0 cargo install inferno --locked
          fi

      - name: Install perf, strace, and hyperfine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y linux-tools-common strace
          sudo apt-get install -y "linux-tools-$(uname -r)" \
            || sudo apt-get install -y linux-tools-azure \
            || sudo apt-get install -y linux-tools-generic
          PERF=$(find /usr/lib/linux-tools -name perf -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$PERF" ]; then PERF=$(command -v perf); fi
          echo "PERF=$PERF" >> "$GITHUB_ENV"
          "$PERF" --version
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -O https://github.com/sharkdp/hyperfine/releases/download/v2.0.0/hyperfine_2.0.0_amd64.deb
          sudo dpkg -i hyperfine_2.0.0_amd64.deb

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Generate the cases
        run: scripts/setup.sh "$SIZE"

      - name: Profile
        run: |
          set -uo pipefail
          OUT=$GITHUB_WORKSPACE/profile
          mkdir -p "$OUT"
          C=$GITHUB_WORKSPACE/cases
          REUBEN=$GITHUB_WORKSPACE/reuben-src/target/release/reuben
          ZOLA=$(command -v zola)
          ulimit -n 65536 || true

          {
            echo "reuben: $("$REUBEN" --version)"
            echo "zola: $("$ZOLA" --version)"
            echo "perf: $("$PERF" --version)"
            echo "kernel: $(uname -r)"
            echo "nproc: $(nproc)"
          } > "$OUT/versions.txt"

          # One failing step doesn't stop the others.
          profile_tool() { # name outdir cmd...
            local name=$1 outdir=$2
            shift 2
            echo "::group::$name"
            rm -rf "$outdir"
            "$PERF" stat -e task-clock,context-switches,cpu-migrations,page-faults,cycles,instructions -r 3 \
              --pre "rm -rf $outdir" -o "$OUT/$name-stat.txt" -- "$@" > /dev/null || echo "perf stat failed for $name"
            rm -rf "$outdir"
            strace -f -c -o "$OUT/$name-strace.txt" "$@" > /dev/null || echo "strace failed for $name"
            rm -rf "$outdir"
            "$PERF" record -F 1999 --call-graph fp -o "$OUT/$name.perf.data" -- "$@" > /dev/null || echo "perf record failed for $name"
            "$PERF" report -i "$OUT/$name.perf.data" --stdio --no-children --percent-limit 0.5 --sort symbol > "$OUT/$name-self.txt" 2> "$OUT/$name-report.err" || true
            "$PERF" report -i "$OUT/$name.perf.data" --stdio --children --percent-limit 2 --sort symbol > "$OUT/$name-children.txt" 2>> "$OUT/$name-report.err" || true
            "$PERF" script -i "$OUT/$name.perf.data" 2>/dev/null | inferno-collapse-perf | inferno-flamegraph > "$OUT/$name.svg" || echo "flame graph failed for $name"
            rm -f "$OUT/$name.perf.data"
            echo "::endgroup::"
          }

          profile_tool reuben "$C/reuben-bare-$SIZE/dist" "$REUBEN" build --root "$C/reuben-bare-$SIZE" --jobs 1
          RAYON_NUM_THREADS=1 profile_tool zola "$C/zola-bare-$SIZE/public" "$ZOLA" --root "$C/zola-bare-$SIZE" build

          # Thread sweep, Reuben only. The last command has no --jobs flag.
          D=$C/reuben-bare-$SIZE
          hyperfine -N --warmup 1 --runs 5 --prepare "rm -rf $D/dist" \
            --export-json "$OUT/reuben-jobs.json" --export-markdown "$OUT/reuben-jobs.md" \
            -n "reuben --jobs 1" "$REUBEN build --root $D --jobs 1" \
            -n "reuben --jobs 2" "$REUBEN build --root $D --jobs 2" \
            -n "reuben --jobs 4" "$REUBEN build --root $D --jobs 4" \
            -n "reuben, no --jobs" "$REUBEN build --root $D" \
            > "$OUT/reuben-jobs.txt" 2>&1 || echo "hyperfine failed"

      - name: Summarize
        if: always()
        run: |
          O=profile
          section() { # title file lines
            [ -f "$2" ] || return 0
            { echo "### $1"; echo; echo '```'; head -n "$3" "$2"; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"
          }
          section Versions "$O/versions.txt" 20
          for t in reuben zola; do
            section "$t: perf stat" "$O/$t-stat.txt" 40
            section "$t: self time, top 30 lines" "$O/$t-self.txt" 30
            section "$t: syscalls, top 20 lines" "$O/$t-strace.txt" 20
          done
          if [ -f "$O/reuben-jobs.md" ]; then
            { echo "### Reuben thread sweep"; echo; cat "$O/reuben-jobs.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-${{ github.run_id }}
          path: profile
